[package]
name = "niri-tablet-easysetup"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Friendly GUI configurator for niri-tablet touchscreen gestures"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
gtk = { version = "0.10", package = "gtk4", features = ["v4_16"] }
adw = { version = "0.8", package = "libadwaita", features = ["v1_5"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1.3"

[profile.release]
lto = "thin"
strip = true
